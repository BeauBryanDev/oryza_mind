name: tests

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      # CPU wheel first, or the resolver pulls the 2 GB CUDA build.
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt
          pip install pytest pytest-asyncio

      # The ONNX models are not in the repo, so the slow tests are deselected.
      # conftest supplies dummy credentials; nothing here reaches Gemini or Weaviate.
      - name: Run tests
        run: pytest -q -m "not slow"
